<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信聊天记录导出</title>
<style>
  :root {
    --primary: #07c160;
    --primary-dark: #06ad56;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --text-sub: #8a919f;
    --border: #e5e6eb;
    --danger: #f53f3f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app { max-width: 720px; margin: 0 auto; padding: 20px 16px 90px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }

  .search {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; margin-bottom: 12px; outline: none; background: var(--card);
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); color: var(--text-sub);
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .list { background: var(--card); border-radius: 12px; overflow: hidden; max-height: 60vh; overflow-y: auto; }
  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item:hover { background: #f7f8fa; }
  .list-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 6px; background: #e8f3ff;
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    color: #3370ff;
  }
  .avatar.group { background: #e8f7ef; color: var(--primary); }
  .info { flex: 1; min-width: 0; }
  .info .name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .count-badge { font-size: 12px; color: var(--text-sub); flex-shrink: 0; }
  .empty { padding: 40px; text-align: center; color: var(--text-sub); }

  /* 底部操作栏 */
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--border); padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .footer .sel { flex: 1; font-size: 14px; color: var(--text-sub); }
  .footer button {
    padding: 12px 32px; background: var(--primary); color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .footer button:disabled { background: #c9cdd4; cursor: not-allowed; }
  .footer button:not(:disabled):hover { background: var(--primary-dark); }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 14px; display: none; z-index: 999;
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <h1>微信聊天记录导出</h1>
  </div>
  <input class="search" id="search" placeholder="搜索联系人 / 群聊..." oninput="renderList()">
  <div class="tabs" id="tabs">
    <span class="tab active" data-cat="all" onclick="switchTab('all')">全部</span>
    <span class="tab" data-cat="friend" onclick="switchTab('friend')">好友</span>
    <span class="tab" data-cat="group" onclick="switchTab('group')">群聊</span>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="footer" id="footer">
  <span class="sel" id="selInfo">未选择</span>
  <button id="exportBtn" onclick="doExport()" disabled>导出聊天记录</button>
</div>

<div class="toast" id="toast"></div>

<script>
let contacts = [];
let selected = new Set();
let currentCat = 'all';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  return fetch(path, { ...opts, headers });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2500);
}

async function loadContacts() {
  const res = await api('/api/contacts');
  if (!res.ok) throw new Error('读取联系人失败');
  contacts = await res.json();
  renderList();
}

function switchTab(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  renderList();
}

function renderList() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  let filtered = contacts.filter(c => {
    if (currentCat !== 'all' && c.category !== currentCat) return false;
    if (kw && !(c.name || '').toLowerCase().includes(kw) && !(c.username || '').toLowerCase().includes(kw)) return false;
    return true;
  });
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${contacts.length ? '暂无匹配联系人' : '没有可导出的联系人。请确认启动命令的 --db 指向解密数据库目录。'}</div>`;
    updateSelInfo();
    return;
  }

  list.innerHTML = filtered.map(c => {
    const isGroup = c.category === 'group';
    const checked = selected.has(c.username) ? 'checked' : '';
    const icon = isGroup ? '👥' : '👤';
    const tag = isGroup ? '群聊' : (c.remark ? `备注: ${c.remark}` : c.username);
    return `<div class="list-item" onclick="toggleSel('${c.username}', this)">
      <input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleSel('${c.username}', this.parentElement)">
      <div class="avatar ${isGroup ? 'group' : ''}">${icon}</div>
      <div class="info">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="sub">${escapeHtml(tag)}</div>
      </div>
    </div>`;
  }).join('');
  updateSelInfo();
}

function toggleSel(username, el) {
  if (selected.has(username)) selected.delete(username);
  else selected.add(username);
  if (el) el.querySelector('input[type=checkbox]').checked = selected.has(username);
  updateSelInfo();
}

function updateSelInfo() {
  const info = document.getElementById('selInfo');
  const btn = document.getElementById('exportBtn');
  if (selected.size === 0) { info.textContent = '未选择'; btn.disabled = true; }
  else { info.textContent = `已选择 ${selected.size} 个联系人`; btn.disabled = false; }
}

async function doExport() {
  if (!selected.size) return;
  const btn = document.getElementById('exportBtn');
  btn.disabled = true; btn.textContent = '导出中...';
  try {
    const res = await api('/api/export', {
      method: 'POST',
      body: JSON.stringify({ usernames: [...selected] }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '导出失败'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^";]+)"?/);
    a.download = m ? decodeURIComponent(m[1]) : '聊天记录.zip';
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出完成，已开始下载');
  } catch (e) { showToast(e.message || '导出失败'); }
  finally { btn.disabled = false; btn.textContent = '导出聊天记录'; }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadContacts().catch(e => showToast(e.message || '读取联系人失败'));
</script>
</body>
</html>
